name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - website/package.json
      - website/package-lock.json
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: root
            directory: .
          - scope: website
            directory: website
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: mkdir -p quality
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit root production dependencies
        if: matrix.scope == 'root'
        run: npm audit --omit=dev --audit-level=low --json > quality/audit-production.json
      - name: Audit all dependencies and reject known vulnerabilities of any severity
        if: success() || failure()
        run: npm audit --audit-level=low --json > quality/audit-full.json
      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-${{ matrix.scope }}
          path: ${{ matrix.directory }}/quality/audit-*.json
          if-no-files-found: warn
