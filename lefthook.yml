# Plain output: VS Code's Git log does not render ANSI colors or the meta box.
colors: false
output:
  - execution_out
  - failure

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,js,cjs,mjs,json}'
      exclude:
        - 'website/**'
      env:
        NO_COLOR: '1'
      run: npx prettier --write --log-level warn {staged_files}
      stage_fixed: true
    lint:
      glob: '*.ts'
      exclude:
        - 'website/**'
      env:
        NO_COLOR: '1'
      run: npx eslint {staged_files}
      fail_text: 'ESLint found errors. Fix them (npm run lint) and commit again.'

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm test
    dist:
      run: npm run test:dist

commit-msg:
  commands:
    commitlint:
      env:
        NO_COLOR: '1'
      run: npx commitlint --edit {1}
      fail_text: >-
        Invalid commit message. Expected "type(scope): description"
        (types: feat, fix, docs, chore, refactor, test...),
        header and body lines up to 100 characters.
